[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hgcal-offline-reco"
version = "0.1.0"
description = "HGCAL offline reconstruction using machine learning techniques"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    { name = "Matteo Marchegiani" },
]
keywords = ["machine learning", "hgcal", "reconstruction", "particle physics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=1.24.0",
    "pandas>=1.17.0",
    "torch>=2.0.0",
    "torch_geometric>=2.7.0",
    "tqdm>=4.65.0",
    "lightning>=2.0.0",
    "awkward>=2.0.0",
    "uproot>=5.0.0",
    "pyarrow>=23.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[project.urls]
Repository = "https://gitlab.cern.ch/hgcal/hgcal-offline-reco"
"Bug Tracker" = "https://gitlab.cern.ch/hgcal/hgcal-offline-reco/-/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
namespaces = false
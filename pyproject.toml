[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hgcal-offline-reco"
version = "0.1.0"
description = "HGCAL offline reconstruction using machine learning techniques"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Matteo Marchegiani" },
]
dependencies = [
    "torch_geometric>=2.7.0",
    "tqdm>=4.65.0",
]

[project.urls]
Repository = "https://gitlab.cern.ch/hgcal/hgcal-offline-reco"

[tool.hatch.build]
packages = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"src" = "."